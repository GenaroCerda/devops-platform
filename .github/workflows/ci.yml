name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint helm/mi-api
      - run: helm template mi-api helm/mi-api -f helm/mi-api/values-prod.yaml > /dev/null